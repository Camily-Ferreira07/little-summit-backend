spring.application.name=little-summit-backend
server.port=8080
server.address=0.0.0.0

# Conexão com o MySQL (senha via variável de ambiente para não vazar no GitHub)
spring.datasource.url=jdbc:mysql://localhost:3306/little_summit?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Mantém intactas as constraints CHECK e ENUMs do seu script SQL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true